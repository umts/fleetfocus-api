<%
  def user_for(host)
    Net::SSH::Config.for(host).fetch(:user, ENV.fetch('USER', nil))
  end
%>

service: fleetfocus-api
image: umts/fleetfocus-api
registry:
  server: ghcr.io
  username: username
  password:
    - KAMAL_REGISTRY_PASSWORD
builder:
  arch: amd64
labels:
  org.opencontainers.image.source: "https://github.com/umts/fleetfocus-api"
servers:
  web:
    - afs-umts-web4.admin.umass.edu
proxy:
  ssl: true
  host: transit-fuel-api.admin.umass.edu
env:
  clear:
    TZ: America/New_York
  secret:
    - MASTER_KEY
ssh:
  user: <%= user_for 'afs-umts-web4.admin.umass.edu' %>
volumes:
  - "fleetfocus-api_log:/app/log"
